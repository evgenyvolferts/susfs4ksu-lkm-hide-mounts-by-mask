# FIELD|GLOB|FSTYPE
# root is the 4th mountinfo column; target is the 5th.
# GLOB matches an entire path and supports * and ? (no bracket expressions).
# FSTYPE is the filesystem type shown after " - ", or * for any.
# Each matching rule registers the actual mount TARGET with SUSFS Guard.

# WARNING: Broad matching of /adb-backed bind mounts may cause
# inconsistent mountinfo on SUSFS4KSU-for-LKM.
# Confirmed with YouTube Morphe and Zygisk Vector.
# See: https://github.com/inforcqb/susfs4ksu-for-lkm/issues/167
#
# Re-enable only if you understand the potential side effects.
#root|/adb/*|*

# AdGuard certificate temporary tmpfs (only when present).
target|/data/local/tmp/adg-ca-copy|tmpfs
